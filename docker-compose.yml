services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: neuralflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - neural_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  trust-engine:
    build: .
    container_name: trust_engine
    restart: always
    ports:
      - "8000:80"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/neuralflow
    depends_on:
      - postgres
    networks:
      - neural_network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

networks:
  neural_network:
    driver: bridge

volumes:
  postgres_data: