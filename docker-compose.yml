version: "3.9"

services:
  # =========================
  # Contenedor principal NeuralFlow (Next.js)
  # =========================
  ai-lab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-lab
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_OPENWEBUI_URL: http://openwebui:3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/neuralflow
    depends_on:
      - openwebui
      - postgres
    volumes:
      - .:/app
    command: npm run dev

  # =========================
  # OpenWebUI
  # =========================
  openwebui:
    image: openwebui/openwebui:latest
    container_name: openwebui
    ports:
      - "3001:3000"
    restart: unless-stopped

  # =========================
  # Postgres
  # =========================
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: neuralflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # =========================
  # N8N
  # =========================
  n8n:
    image: n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: "admin"
      N8N_BASIC_AUTH_PASSWORD: "admin"
      DB_TYPE: postgres
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: neuralflow
      DB_POSTGRESDB_USER: postgres
      DB_POSTGRESDB_PASSWORD: postgres
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data: